<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>元捷建設｜網站後台</title>
  <link rel="stylesheet" href="admin.css?v=6">
</head>
<body>
  <div class="shell">
    <header>
      <div><strong>元捷建設</strong><span>網站內容後台</span></div>
      <button id="signOut" class="quiet-button" hidden>登出</button>
    </header>

    <section id="login" class="card login">
      <h1>管理員登入</h1>
      <p>登入連結只會寄到公司後台管理信箱。</p>
      <form id="loginForm">
        <input id="email" type="email" value="lijie5868@gmail.com" required>
        <button>寄送登入連結</button>
      </form>
      <p id="loginMessage" class="message"></p>
    </section>

    <main id="app" hidden>
      <div class="dashboard-heading">
        <div>
          <h1>網站內容管理</h1>
          <p>先儲存草稿，確認後再發布到正式網站。</p>
        </div>
      </div>
      <nav class="admin-tabs" aria-label="後台功能">
        <button type="button" class="active" data-view="pages">網站頁面</button>
        <button type="button" data-view="navigation">導覽選單</button>
      </nav>

      <section id="pagesView" class="admin-view">
        <div class="pages-layout">
          <aside class="card page-sidebar">
            <div class="section-heading">
              <div><span class="eyebrow">內容管理</span><h2>網站頁面</h2></div>
            </div>
            <label class="search-field">
              <span class="sr-only">搜尋頁面</span>
              <input id="pageSearch" type="search" placeholder="搜尋頁面">
            </label>
            <div id="pageList" class="page-list"></div>
          </aside>

          <section class="card editor">
            <div class="toolbar">
              <div><span class="state">草稿</span><small id="savedAt"></small></div>
              <div>
                <button id="save" class="secondary">儲存草稿</button>
                <button id="publish">發布到網站</button>
                <a id="visitPage" class="visit-link" target="_blank" rel="noopener">查看正式頁面 ↗</a>
              </div>
            </div>
            <div class="form-grid">
              <label>頁面標題<input id="title"></label>
              <label>搜尋摘要<textarea id="description" rows="2"></textarea></label>
            </div>
            <div class="edit-tools" aria-label="文字編輯工具">
              <button type="button" data-command="bold">粗體</button>
              <button type="button" data-command="createLink">加入連結</button>
              <button type="button" id="imageUploadButton">上傳圖片</button>
              <button type="button" id="editImage" class="secondary" disabled>編輯選取圖片</button>
              <input id="imageUpload" class="sr-only" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
            </div>
            <iframe id="visualEditor" title="頁面內容編輯器"></iframe>
            <p class="hint">直接點選文字可修改；點選圖片後可裁切或縮放。發布後重新整理正式網站即可看到更新。</p>
            <p id="appMessage" class="message"></p>
          </section>
        </div>
      </section>

      <section id="navigationView" class="admin-view" hidden>
        <div class="card navigation-card">
          <div class="navigation-intro">
            <div>
              <span class="eyebrow">全站設定</span>
              <h2>導覽選單</h2>
              <p>這裡的名稱、副標、顯示與順序，會同步套用到每一頁的頁首選單。</p>
            </div>
            <div class="navigation-actions">
              <button id="saveNavigation" class="secondary">儲存選單草稿</button>
              <button id="publishNavigation">發布選單</button>
            </div>
          </div>
          <div class="navigation-labels" aria-hidden="true">
            <span>選單名稱</span><span>第二行副標</span><span>連結頁面</span><span>順序</span><span>顯示</span>
          </div>
          <div id="navigationList" class="navigation-list"></div>
          <p class="hint">選單連結已固定保護，可避免誤改後造成網頁失效。</p>
          <p id="navigationMessage" class="message"></p>
        </div>
      </section>
    </main>
  </div>
  <dialog id="imageDialog" class="image-dialog" aria-labelledby="imageDialogTitle">
    <div class="image-dialog-heading"><h2 id="imageDialogTitle">編輯圖片</h2><button type="button" id="closeImageDialog" class="quiet-button" aria-label="關閉">×</button></div>
    <p class="hint">拖曳圖片調整位置，使用滑桿放大或縮小。預覽畫面即為裁切後的範圍。</p>
    <div class="crop-stage"><canvas id="cropCanvas" width="640" height="400" aria-label="圖片裁切預覽"></canvas></div>
    <div class="image-controls">
      <label>裁切比例<select id="cropRatio"><option value="free">原圖比例</option><option value="1">正方形 1:1</option><option value="1.333333">橫式 4:3</option><option value="1.777778">橫式 16:9</option></select></label>
      <label>裁切縮放 <input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      <label>頁面顯示寬度 <input id="imageWidth" type="range" min="25" max="100" step="5" value="100"><output id="imageWidthValue">100%</output></label>
      <label>圖片說明文字 <input id="imageAlt" type="text" placeholder="描述這張圖片"></label>
    </div>
    <p id="imageMessage" class="message" aria-live="polite"></p>
    <div class="image-dialog-actions"><button type="button" id="resizeImage" class="secondary" hidden>只調整顯示大小</button><button type="button" id="applyImage">裁切並套用圖片</button></div>
  </dialog>
  <script src="config.js"></script>
  <script type="module" src="admin.js?v=6"></script>
</body>
</html>
