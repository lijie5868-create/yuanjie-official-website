<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>元捷建設｜網站後台</title><link rel="stylesheet" href="admin.css?v=2"></head><body><div class="shell"><header><div><strong>元捷建設</strong><span>網站內容後台</span></div><button id="signOut" hidden>登出</button></header><section id="login" class="card login"><h1>管理員登入</h1><p>登入連結只會寄到公司後台管理信箱。</p><form id="loginForm"><input id="email" type="email" value="lijie5868@gmail.com" required><button>寄送登入連結</button></form><p id="loginMessage" class="message"></p></section><main id="app" hidden><aside class="card"><h2>網站頁面</h2><div id="pageList" class="page-list"></div></aside><section class="card editor"><div class="toolbar"><div><span class="state">草稿</span><small id="savedAt"></small></div><div><button id="save" class="secondary">儲存草稿</button><button id="publish">發布到網站</button></div></div><label>頁面標題<input id="title"></label><label>搜尋摘要<textarea id="description" rows="2"></textarea></label><div class="edit-tools"><button type="button" data-command="bold">粗體</button><button type="button" data-command="createLink">加入連結</button><label class="upload">上傳圖片<input id="imageUpload" type="file" accept="image/*"></label></div><iframe id="visualEditor" title="頁面內容編輯器"></iframe><p class="hint">直接點選預覽中的文字即可修改。發布後約 5 分鐘內更新正式網站。</p><p id="appMessage" class="message"></p></section></main></div><script src="config.js"></script><script type="module" src="admin.js?v=2"></script></body></html>
